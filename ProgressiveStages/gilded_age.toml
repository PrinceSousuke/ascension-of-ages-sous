# ============================================================================
# Stage: Gilded Age
# ============================================================================
# CHOKEPOINT MODEL (rewritten 2026-05-02). NauTec moved from industrial_revolution
# to here per pack memory ("NauTec laser→Gilded"). Oritech narrowed from 36
# items to 4 sub-chain chokepoints per ps_chokepoint_narrowing audit:
#   - processing_unit (gates 19 compute-tier items: fluxgate, advcomputer, etc.)
#   - simple_augment_station (gates 14 augment items)
#   - biosteel_ingot (gates 14 organic-tier items)
#   - enderic_lens (gates 11 ender-tech items)
# These 4 chokepoints cascade to all 36 previously-listed gilded oritech items
# (machine addons, exo armor, jetpacks, hand_drill, silicon_*, etc.).
# ============================================================================

[stage]
id = "gilded_age"
display_name = "Gilded Age"
description = "Scaled production, capital resources, and post-factory expansion."
icon = "create:cogwheel"
unlock_message = "&e&lGilded Era Unlocked! &r&7Scaled production and capital resources open up."
dependency = "industrial_revolution"

[locks]
items = [
  "minecraft:deepslate_emerald_ore",
  "minecraft:emerald",
  "minecraft:emerald_block",
  "minecraft:emerald_ore",
  "moderndynamics:superconductor_cable",
  # ─── Oritech Gilded — 4 sub-chain chokepoints (NARROWED 2026-05-02 from 36) ───
  # processing_unit: 19 in-mod consumers (fluxgate, advcomputer, processingunit,
  #   silicon_wafer, super_ai_chip, machine_*_addon, etc.)
  "oritech:processing_unit",
  # simple_augment_station: 14 in-mod consumers (armor, attackdamage, autofeeder,
  #   speed_boost, hp_boost, all augment items)
  "oritech:simple_augment_station",
  # biosteel_ingot: 14 in-mod consumers (hpboost, hpboostmore, speedboost,
  #   biosteel-derived items)
  "oritech:biosteel_ingot",
  # enderic_lens: 11 in-mod consumers (enderlens, cloak, farblockreach,
  #   ender-tech items)
  "oritech:enderic_lens",
  # ─── Theurgy Gilded — mercury_catalyst (2026-05-03). Multiblock-style energy
  # source chokepoint: converts mercury crystal → mercury flux. Mercurial
  # logistics network (logistics_connector_node, logistics_item_extractor /
  # inserter, copper_wire) AND caloric_flux_emitter both REQUIRE flux to function.
  # Without the catalyst, no automation tier. Recipe = iron + gold + quartz +
  # theurgy:alchemical_mercuries (cascades from IR Mercury extraction). JAR-
  # verified data/theurgy/recipe/crafting/shaped/mercury_catalyst.json. Caloric
  # flux emitter is downstream of catalyst (uses flux), not the chokepoint root —
  # catalyst is per the "earliest unique single item" rule.
  "theurgy:mercury_catalyst",
  # ─── Occultism Gilded — book_of_binding_afrit (2026-05-03). Activation-item
  # chokepoint for Afrit-tier rituals: craft_iesnium_butcher_knife (Iesnium-tier
  # Otherworld crafting), craft_miner_afrit_deeps (deep ore mining → Gilded
  # resource economy), summon_afrit_crusher / crystallizer / smelter (apex
  # processing). Iesnium-tier crafting = Gilded-coded. Verified
  # data/occultism/recipe/ritual/craft_iesnium_butcher_knife.json activation_item.
  "occultism:book_of_binding_afrit"
]
