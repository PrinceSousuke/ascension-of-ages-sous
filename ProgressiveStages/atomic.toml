  # ─── Oritech Atomic — 7 chokepoints (NARROWED 2026-05-02 from 21 items) ───
  # JAR scan confirmed three parallel sub-chains (no single cascade root):
  #   particle_collision multiblock → overcharged_crystal → prometheum_ingot
  #     → machine_core_7 → atomic-tier oritech machines/tools
  #   atomic_forge multiblock → prometheum_ingot, advanced_computing_engine
  #   laser multiblock (laser_arm_block) → plutonium_dust, fluxite
  # Plus a few apex items not covered by the multiblock cascades.
  # Lock these 7 to gate all 21 previously-listed atomic-tier oritech items:
  "oritech:overcharged_crystal",          # 37 in-mod consumers (budding catalysts, prometheum_ingot, nether_star, etc.)
  "oritech:prometheum_ingot",             # gates machine_core_7 + promethium tools (defensive — already cascade-locked via overcharged_crystal)
  "oritech:plutonium_pellet",             # 8 plutonium-chain consumers (pelletbasic/better/ultimate, blocks)
  "oritech:arcane_augment_station",       # 7 arcane augment consumers (cloak, flight, gravity, etc.)
  "oritech:accelerator_controller",       # apex multiblock; not cascade-covered by the 3 above
  "oritech:enchantment_catalyst_block",   # gates enchanter_block + spawner_controller_block (2 cascades)
  "oritech:laser_arm_block",              # multiblock-controller; gates plutonium_dust + portable_laser + destroyer_block + fluxite (laser-recipe-typed)

  # ─── Per-mod chokepoints (2026-05-02 modwide elimination) ───
  # Ballistix — missiletier1 is consumed by missile_tier2/tier3 (verified
  # in JAR: ballistix:missile_tier2_electro/_noelectro both list tier1 as
  # ingredient). Locking it gates all 3 tiers + cascade to launchers.
  "ballistix:missiletier1",
  # Create Nuclear — reactor_controller is the mechanical_crafting result
  # that gates the multiblock reactor; without it the entire reactor chain
  # cannot be built (verified: data/createnuclear/recipe/mechanical_crafting/
  # reactor_controller.json).
  "createnuclear:reactor_controller",
  # Nuclear Science — fissionreactorcore is the entry-tier reactor core,
  # also consumed by msrreactorcore (molten-salt reactor variant). Gates
  # the entire NS reactor chain (verified: data/nuclearscience/recipe/
  # machine_msrreactorcore.json lists fissionreactorcore as ingredient).
  "nuclearscience:fissionreactorcore"
]
