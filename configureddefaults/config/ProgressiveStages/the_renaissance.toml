  # locking processor_binding cascades to controller + ExtraDisks/ExtraStorage/
  # RSRequestify (all of which need the RS controller).
  "refinedstorage:processor_binding",
  # Pastel — pastel_node is the network root
  "pastel:pastel_node",
  # Malum — spirit_altar alone (NARROWED 2026-05-02). soul_stained_steel_ingot's
  # entry production is via malum:spirit_infusion at the altar (refined_soulstone
  # + iron_ingot + spirits); block/nugget paths are decompose loops requiring
  # existing soul_stained_steel. Locking the altar gates first-time ingot
  # creation, cascading to 15 downstream items.
  # NOTE: spirit_altar is a multiblock-controller chokepoint (gates by
  # placement, not strict consume — see CLAUDE.md multiblock policy 2026-05-02).
  "malum:spirit_altar",
