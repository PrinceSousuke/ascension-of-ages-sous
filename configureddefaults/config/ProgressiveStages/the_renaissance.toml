  # independent gates: iron_casing gates 19 machines, basic_coil gates 12 (incl.
  # advanced_coil/battery_box/breaker which don't need iron_casing).
  "actuallyadditions:iron_casing",
  "actuallyadditions:basic_coil",
  # GnKinetics — industrial_gear gates the advanced gear chain
  "gnkinetics:industrial_gear",
  # Create Integrated Farming: NO chokepoint — roost is quested in m4_relics_and_burrows
  # (Medieval); brass-tier recipes naturally gate it. Removed `roost`/`fishing_net` locks.
  # Create: Crafts & Additions — alternator + capacitor gate RF generation/storage
  "createaddition:alternator",
  # Create: New Age — basic_energiser is the entry transformer
  "create_new_age:basic_energiser",
  # Slice & Dice: NO chokepoint — slicer is quested in m4_relics_and_burrows (Medieval).
  # Brass-tier recipe naturally gates it. Removed `slicer` lock.
  # ProjectRed — plate gates all silicon-based circuit progression (silicon→plate→circuit)
  "projectred_core:plate",
  # Cable Tiers — elite_importer is the entry-tier extension cable (refined
  # storage compatible). Mega/Ultra/Creative tiers all consume elite_importer
  # in their recipes, so locking the elite tier gates the whole mod chain
  # (added 2026-05-02 modwide elim; quested in r8_the_inventory_problem).
  "cabletiers:elite_importer",

  # ─── PneumaticCraft — pressure_chamber_wall alone (NARROWED 2026-05-02 from
  # 11 items). The wall is consumed by 8 chamber-component recipes including
  # glass, valve, interface, and downstream items (block_tracker_upgrade,
  # spawner_extractor). Without walls, no chamber, no pressure-crafted items.
  # IR-tier PNC items (refinery, advanced_liquid_compressor, fluid_mixer,
  # refinery_output, thermal_compressor) cascade-lock through this — IR PNC
  # locks were also removed in this audit. Quested in r7_renaissance_tech. ───
  "pneumaticcraft:pressure_chamber_wall",
  # ─── Theurgy — calcination_oven (Renaissance entry, 2026-05-03). Multiblock-
  # controller chokepoint: hosts theurgy:calcination custom recipe type when
  # placed atop a heat source (pyromantic_brazier). Without this block, no
  # Salt extraction → no transmutation chain → mod cannot bootstrap. JAR-verified
  # at data/theurgy/recipe/crafting/shaped/calcination_oven.json (recipe = copper
  # block + iron ingot — both Renaissance-tier ingredients). Sister apparatus
  # (distiller, fermentation_vat, incubator) cascade-gate via Salt/Sulfur/Mercury
  # availability, so calcination_oven is the unique entry chokepoint per the
  # "earliest unique single item" rule.
  "theurgy:calcination_oven"
