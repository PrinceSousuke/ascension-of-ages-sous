# ============================================================================
# Stage: The Renaissance
# ============================================================================
# CHOKEPOINT MODEL (rewritten 2026-05-02 from blanket item_mods to chokepoints)
# Mod-wide item_mods locks were causing JEI/EMI tag pollution: tag-based recipe
# ingredients (e.g. c:logs) iterated every member of the tag and rendered a
# lock icon on each modded entry whose mod was item_mods-locked. Replaced with
# per-mod chokepoint items (the entry-tier crafting prerequisite that gates a
# mod's downstream recipes).
# ============================================================================

[stage]
id = "the_renaissance"
display_name = "The Renaissance"
description = "Realm travel, stronger gear, and the first broad outward push."
icon = "minecraft:diamond_pickaxe"
unlock_message = "&b&lThe Renaissance Unlocked! &r&7Deeper travel, better gear, and stronger branches are now open."
dependency = "medieval_times"

[locks]

