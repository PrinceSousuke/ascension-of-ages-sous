# ============================================================================
# Stage: Industrial Revolution
# ============================================================================
# CHOKEPOINT MODEL (rewritten 2026-05-02). Replaced 30 mod-wide item_mods
# locks with chokepoint items. Removed `immersiveengineering:wirecutter` from
# the lock list (kept accessible from Medieval onward per Andrew's request —
# low-voltage IE wires/tanks are Medieval-tier; the wirecutter recipe is
# string + iron, intrinsically Medieval). Removed precision_mechanism — see
# quest-progression bug audit (it's craftable in Renaissance from gold plates).
# ============================================================================

[stage]
id = "industrial_revolution"
display_name = "Industrial Revolution"
description = "Factory-campus maturity, serious process chains, and scaled infrastructure."
icon = "modern_industrialization:steel_machine_casing"
unlock_message = "&7&lIndustrial Revolution Unlocked! &r&7Serious factory growth and larger machine campuses are now open."
dependency = "the_renaissance"

[locks]

# ----------------------------------------------------------------------------
# ITEMS - IR-tier specific items + per-mod chokepoints.
# ----------------------------------------------------------------------------
items = [
  # ─── AE2 IR — inscriber alone (NARROWED 2026-05-02 from 38 items). All 38
  # IR-tier AE2 items (storage cells, terminals, network parts, quantum_*,
  # wireless_*, fluix_*_cable, molecular_assembler, pattern_*_terminal,
  # spatial_storage_cell_*, vibration_chamber, energy_cell, dense_energy_cell,
  # energy_acceptor, energy_level_emitter, cell_workbench, crystal_resonance_
  # generator, fluid/item_storage_cell_*, fluid_cell_housing, item_cell_housing,
  # inscriber) require inscribed processors (calculation/logic/engineering).
  # The inscriber is the ONLY producer of inscribed processors. Locking inscriber
  # at IR cascade-locks all 38 items. fluix_crystal stays at Renaissance for
  # entry AE2 networks; inscriber gates the IR-tier expansion stack.
  "ae2:inscriber",

  # ─── Bosses of Mass Destruction (mod loaded as BOMD-NeoForge-1.21-1.3.2.jar;
  # namespace verified as bosses_of_mass_destruction). obsidian_heart is the
  # Obsidilith boss kill item — gates IR_final → Gilded transition. ───
  "bosses_of_mass_destruction:obsidian_heart",

  # ─── AE2 charger REMOVED (Renaissance-craftable, was over-gated) ───
  # ─── createaddition:portable_energy_interface REMOVED (Renaissance use, r7 quest) ───
  # ─── refinedstorage:autocrafter REMOVED (Renaissance use, r8 quest) ───

  # ─── Cataclysm endgame ───
  "cataclysm:lava_power_cell",

  # ─── Aeronautics — single key item; mod has datapack-only registry ───
  # ─── Aether endgame: phoenix_bow stays at IR; the rest of Aether is
  #     gated by dimension lock at Renaissance ───
  # NOTE: phoenix_bow REMOVED — it's a Renaissance-tier Aether item used in
  # quests at r4_first_sky; the dim lock alone is sufficient.

  # ─── Create endgame — precision_mechanism REMOVED (Renaissance-craftable
  # from gold plates + cogwheels + iron nuggets, no diamond/emerald in chain) ───

  # ─── Energized Power chokepoint ───
  "energizedpower:advanced_battery_box",

  # ─── Mekanism IR-tier alloy + chokepoint ───
  "mekanism:alloy_atomic",
  "mekanism:basic_energy_cube",
  "mekanism:basic_control_circuit",

  # ─── Modern Industrialization — bronze_machine_casing alone (NARROWED
  # 2026-05-02 from 46 items). bronze_machine_casing is consumed by 25 recipes
  # including basic_machine_hull. basic_machine_hull (which consumes bronze
  # casing) feeds 51 downstream recipes. advanced_machine_hull (consuming
  # basic_machine_hull) feeds 37 more. The cascade chain is:
  #   bronze_machine_casing → basic_machine_hull → advanced_machine_hull → all
  #     46 previously-listed IR-tier MI items (cables, tanks, machines, drills,
  #     boilers, turbines, hulls, casings, pumps, compressors, etc.)
  # Lock bronze_machine_casing alone and the entire IR-tier MI stack
  # cascade-locks through it.
  "modern_industrialization:bronze_machine_casing",

  # ─── Modern Dynamics — REMOVED ALL 5 cable locks 2026-05-02. The 5 cable
  # tiers (ev/hv/lv/mv_cable, machine_extender) are PARALLEL items, no internal
  # chain (each independently crafted from tier-appropriate metals: copper,
  # silver, gold, diamond). Materials are already PS-locked at appropriate
  # stages (alltheores metals at Renaissance, etc.), so cables self-gate via
  # ingredient availability. The 5 individual locks added no gating beyond what
  # the materials already provide.

  # ─── PneumaticCraft IR-tier — REMOVED ALL 5 locks 2026-05-02. The 5 IR-tier
  # PNC machines (refinery, advanced_liquid_compressor, fluid_mixer, refinery_
  # output, thermal_compressor) all require pressure-chamber-crafted items
  # (compressed_iron_gear, machine_frame_pneumatic, etc.). Pressure chamber
  # requires pressure_chamber_wall (locked at Renaissance — see
  # the_renaissance.toml). Without walls, no chamber, no IR machines. The IR
  # locks were redundant with the Renaissance cascade.

  # ─── Railways IR-tier (mod-wide moved here from Renaissance) ───
  "railways:fuel_tank",

  # ─── ProjectRed: red_ingot is the silicon-circuit gateway item ───
  "projectred_core:red_ingot",

  # ─── Refined Storage: autocrafter REMOVED (Renaissance use, quested in r8) ───

  # ─── Forbidden Arcanus IR-tier ───
  "forbidden_arcanus:aureal_tank",
  "forbidden_arcanus:smelter_prism",

  # ─── Immersive Engineering HV-tier (LV/MV stays at Medieval/Renaissance) ───
  # NOTE: wirecutter REMOVED per Andrew's request (kept Medieval-tier).
  # NOTE: wirecoil_copper / wirecoil_copper_ins REMOVED — Renaissance-tier LV.
  # NOTE: capacitor_mv / wirecoil_electrum / fluid_pipe REMOVED — Renaissance MV-tier
  # (quested in r7_renaissance_tech and metallurgy; demoted from IR to natural recipe gating).
  "immersiveengineering:capacitor_hv",
  "immersiveengineering:fluid_pump",
  "immersiveengineering:high_power_biodiesel_bucket",
  "immersiveengineering:wirecoil_steel",
  # NOTE: capacitor_lv REMOVED — Renaissance-tier LV capacitor

  # ─── Create: Crafts & Additions: NO IR-specific items locked.
  # NOTE: portable_energy_interface REMOVED — Renaissance use, quested in r7.
  # NOTE: capacitor / copper_wire / gold_wire / iron_wire REMOVED — Renaissance-tier.
  # The Renaissance chokepoint `alternator` (Renaissance items) gates the chain. ───

  # ─── Create: New Age IR-tier (basic_energiser is Renaissance chokepoint) ───
  # NOTE: copper_wire / generator_coil REMOVED — Renaissance-tier intermediate
  # (basic_energiser chokepoint at Renaissance gates the chain).

  # ─── DivineRPG capstone (other DivineRPG dimension portals are below) ───
  "divinerpg:halite_slicer",

  # ─── Enderio chokepoint = basic_capacitor (every Enderio machine needs one) ───
  "enderio:basic_capacitor",

  # ─── Modular Force Fields chokepoint (no underscores in registry IDs) ───
  "modularforcefields:coercionderiver",
  "modularforcefields:fortronfieldprojector",

  # ─── Psi chokepoint ───
  "psi:cad_assembler",

  # ─── Mahoutsukai chokepoint ───
  "mahoutsukai:morgan",

  # ─── Solar Flux Reborn — tier-2 panel and up locked (T1 = unlocked) ───
  "solarflux:photovoltaic_cell_2",
  "solarflux:photovoltaic_cell_3",

  # ─── Per-mod chokepoints (2026-05-02 modwide elimination) ───
  # Immersive Energistics (immeng) — REMOVED 2026-05-02 post-audit.
  # The wirecoil_me lock was based on a faulty premise: JAR scan
  # (audit_artifacts/ps_chokepoint_narrowing_20260502.yaml) confirmed the 4
  # immeng items (wirecoil_me, wirecoil_me_dense, connector_me, connector_me_relay)
  # are PEERS, not a chain. wirecoil_me_dense uses ae2:fluix_covered_dense_cable,
  # not wirecoil_me. All 4 self-gate via their AE2 component ingredients which
  # are already PS-locked (fluix_crystal at Renaissance, fluix_glass_cable +
  # fluix_covered_dense_cable + fluix_block at IR). No immeng lock needed.
  # NauTec — augmentation_station is the multiblock controller for the augment
  # system; augments themselves are gameplay-driven (no JSON ingredient chain).
  # Gates by PLACEMENT (player can't build the multiblock without crafting the
  # controller first). Quested in ir4_the_lab.
  # NOTE: Per the strict consume rule in CLAUDE.md, this is a multiblock-
  # controller-style chokepoint that gates progression by being required to
  # PLACE the multiblock — augmentation_station_extension does NOT consume
  # augmentation_station as a recipe ingredient (verified in JAR).
  "nautec:augmentation_station",
  # PowerGrid — electric_motor is the most-consumed internal component
  # (4 downstream recipes within powergrid: constant_speed_motor, electric_fan,
  # servo, plus electric_motor itself). Quested in ir3_fuel_and_power.
  # JAR-verified consume chain. Real chokepoint.
  "powergrid:electric_motor",
  # ─── Theurgy IR — digestion_vat (2026-05-03). Multiblock-controller
  # chokepoint hosting theurgy:digestion custom recipe type (tier-conversion of
  # matter, e.g. iron-tier → gold-tier). Recipe consumes c:gems/sal_ammoniac +
  # minecraft:decorated_pot + gold (IR-tier ingredients). Tier-conversion
  # gameplay = IR-coded. Fermentation_vat self-gates via theurgy:alchemical_sulfurs
  # tag (player must have already extracted Sulfur via Renaissance apparatus) so
  # fermentation cascade-gates without its own lock. Incubator cascades through
  # both vats. JAR-verified data/theurgy/recipe/crafting/shaped/digestion_vat.json.
  "theurgy:digestion_vat",
  # ─── Occultism IR — book_of_binding_djinni (2026-05-03). Activation-item
  # chokepoint: the bound version (book_of_binding_bound_djinni) is the
  # activation_item for ALL Djinni-tier rituals — including dimensional_mineshaft
  # (Djinni-tier per data/occultism/recipe/ritual/craft_dimensional_mineshaft.json),
  # summon_djinni_manage_machine (machine automation), summon_djinni_crystallizer,
  # and the Djinni miner. Foliot tier (Renaissance) self-gates via Demon's Dream →
  # Third Eye → otherstone → bowl recipe cascade — no PS lock needed at Renaissance.
  # Djinni tier IS the IR-coded automation tier.
  "occultism:book_of_binding_djinni",

  # ─── Oritech foundational ingredient (2026-05-03 leak audit P1). adamant_ingot
  # is required for motor → assembler → processing_unit per
  # Oritech_Full_Audit_2026-04-22.md row 43. Locking adamant at IR cascade-gates
  # the entire oritech progression; existing machine/output locks
  # (processing_unit, simple_augment_station at Gilded; 7 atomic-tier items)
  # remain as belt-and-suspenders. Closes motor-craftable-via-vanilla-table bypass.
  "oritech:adamant_ingot",

  # ??? IE steel is NOT locked here: R7 Renaissance Tech deliberately quests
  # immersiveengineering:ingot_steel as its steel capstone. HV-specific outputs
  # stay locked above; do not use the base steel ingot as an IR chokepoint.

  # ─── MFR foundational matrix (2026-05-03 leak audit P3). focusmatrix is
  # consumed by all MFR machine recipes (coercionderiver, fortronfieldprojector,
  # fortroncapacitor, biometricidentifier, interdictionmatrix). The existing
  # coercionderiver + fortronfieldprojector locks gate single outputs while other
  # MFR machines have shaped recipes. Locking the matrix cascades through all MFR.
  "modularforcefields:focusmatrix"
]

